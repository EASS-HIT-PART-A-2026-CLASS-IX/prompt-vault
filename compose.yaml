services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - prompt_data:/app/data
    environment:
      PROMPT_VAULT_REDIS_URL: redis://redis:6379/0
      PROMPT_VAULT_RATE_LIMIT_PER_MINUTE: 30
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  prompt_data:
