name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest prompt_vault/tests -v

  schemathesis:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install schemathesis
        run: uv run pip install schemathesis

      - name: Start API
        run: |
          mkdir -p data
          uv run alembic upgrade head
          uv run uvicorn prompt_vault.app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run Schemathesis
        run: uv run schemathesis run http://localhost:8000/openapi.json --checks not_a_server_error
